<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Harry James GitHub overview stats</title>
  <desc id="desc">GitHub overview for Harry James showing public repositories, stars, followers, following, and repository languages.</desc>
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#FDF8F4"/>

  <!-- stat cards -->
  <g transform="translate(60, 44)">
    <g id="stat-repos">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">11</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">公开仓库</text>
    </g>

    <g id="stat-stars" transform="translate(280, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Stars</text>
    </g>

    <g id="stat-followers" transform="translate(560, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">2</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">关注者</text>
    </g>

    <g id="stat-following" transform="translate(840, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">2</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">正在关注</text>
    </g>
  </g>

  <!-- language bars -->
  <g transform="translate(60, 220)">
    <text class="sans" font-size="24" font-weight="700" fill="#3C4F66">主要语言</text>
  </g>

  <g transform="translate(60, 270)" class="sans" font-size="18">
    <!-- Kotlin 100% -->
    <text x="0" y="20" fill="#6F7F90">Kotlin</text>
    <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
    <rect x="150" y="0" width="720" height="28" rx="6" fill="#A97BFF"/>
    <text x="890" y="20" fill="#3C4F66" font-weight="600">100%</text>
  </g>
</svg>
