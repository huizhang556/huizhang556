<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Selina Martin GitHub overview stats</title>
  <desc id="desc">GitHub overview for Selina Martin showing public repositories, stars, followers, following, and repository languages.</desc>
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#FDF8F4"/>

  <!-- stat cards -->
  <g transform="translate(60, 44)">
    <g id="stat-repos">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">91</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Public Repos</text>
    </g>

    <g id="stat-stars" transform="translate(280, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Total Stars</text>
    </g>

    <g id="stat-followers" transform="translate(560, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Followers</text>
    </g>

    <g id="stat-following" transform="translate(840, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">12</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Following</text>
    </g>
  </g>

  <!-- language bars -->
  <g transform="translate(60, 220)">
    <text class="sans" font-size="24" font-weight="700" fill="#3C4F66">Top Languages</text>
  </g>

  <g transform="translate(60, 270)" class="sans" font-size="18">
    <!-- Preview values use the public repository language distribution. Actions refresh exact byte percentages. -->
    <g transform="translate(0,0)"><text x="0" y="20" fill="#6F7F90">Python</text><rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/><rect x="150" y="0" width="136" height="28" rx="6" fill="#E0A07E"/><text x="890" y="20" fill="#3C4F66" font-weight="600">19%</text></g>
    <g transform="translate(0,44)"><text x="0" y="20" fill="#6F7F90">TypeScript</text><rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/><rect x="150" y="0" width="115" height="28" rx="6" fill="#5668A3"/><text x="890" y="20" fill="#3C4F66" font-weight="600">16%</text></g>
    <g transform="translate(0,88)"><text x="0" y="20" fill="#6F7F90">Go</text><rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/><rect x="150" y="0" width="92" height="28" rx="6" fill="#347CC5"/><text x="890" y="20" fill="#3C4F66" font-weight="600">13%</text></g>
    <g transform="translate(0,132)"><text x="0" y="20" fill="#6F7F90">JavaScript</text><rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/><rect x="150" y="0" width="92" height="28" rx="6" fill="#F0D84A"/><text x="890" y="20" fill="#3C4F66" font-weight="600">13%</text></g>
    <g transform="translate(0,176)"><text x="0" y="20" fill="#6F7F90">C++</text><rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/><rect x="150" y="0" width="57" height="28" rx="6" fill="#60438A"/><text x="890" y="20" fill="#3C4F66" font-weight="600">8%</text></g>
  </g>
</svg>
