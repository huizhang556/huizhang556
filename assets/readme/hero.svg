<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Selina Martin GitHub profile welcome banner</title>
  <desc id="desc">Light pastel welcome banner for Selina Martin, a C++ and Qt developer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF8F4"/>
      <stop offset="100%" stop-color="#F7F3EE"/>
    </linearGradient>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="38" fill="url(#bg)"/>

  <!-- subtle decorative nodes / connection motif -->
  <circle cx="1060" cy="72" r="10" fill="#F3C5B4" opacity="0.55"/>
  <circle cx="1106" cy="108" r="7" fill="#AFDADA" opacity="0.5"/>
  <path d="M1070 80 L1099 102" stroke="#C6D8E2" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- main title block -->
  <g transform="translate(80, 94)">
    <text class="sans" font-size="22" font-weight="600" fill="#94AAB9">Hi, I'm</text>
    <text class="sans" y="72" font-size="68" font-weight="750" fill="#3C4F66">Selina Martin</text>
    <text class="sans" y="126" font-size="28" fill="#6F7F90">C++ / Qt 开发者</text>
  </g>

  <!-- quick stats panel -->
  <g transform="translate(810, 64)">
    <rect x="0" y="0" width="340" height="180" rx="26" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
    <text class="sans" x="30" y="42" font-size="15" font-weight="700" letter-spacing="1" fill="#A9BCC9">GitHub 概览</text>

    <g transform="translate(30, 80)">
      <text class="sans" font-size="38" font-weight="700" fill="#3C4F66">91</text>
      <text class="sans" y="26" font-size="16" fill="#8A9CAD">仓库</text>
    </g>

    <g transform="translate(145, 80)">
      <text class="sans" font-size="38" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" y="26" font-size="16" fill="#8A9CAD">Stars</text>
    </g>

    <g transform="translate(248, 80)">
      <text class="sans" font-size="38" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" y="26" font-size="16" fill="#8A9CAD">关注者</text>
    </g>
  </g>
</svg>
