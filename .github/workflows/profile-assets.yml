name: Update Profile Assets

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate profile SVG assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile_assets.py
      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/readme/*.svg
          if git diff --cached --quiet; then
            echo "No profile asset changes"
            exit 0
          fi
          git commit -m "chore: update profile assets"
          git push
