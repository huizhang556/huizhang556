name: Update Profile Assets

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate profile SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_assets.py
      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/readme/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile assets"
          git push